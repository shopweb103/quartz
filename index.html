<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Chat Room</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h2>🌐 Public Chat Room</h2>
        </header>

        <div class="username-box">
            <input type="text" id="username" placeholder="তোমার নাম লেখো..." autocomplete="off">
        </div>

        <div id="chat-messages" class="chat-messages"></div>

        <form id="chat-form" class="chat-form">
            <input type="text" id="message-input" placeholder="মেসেজ লেখো..." required autocomplete="off">
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
